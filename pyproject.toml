[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiber-route-kml"
version = "0.1.0"
description = "FTTx optical fiber route KML/KMZ generator with 1310/1550nm optical link budget calculation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
google = ["google-auth>=2.23.0"]
dev = [
    "pytest>=7.4.0",
    "ruff==0.1.13",
]

[project.scripts]
fiber-route-kml = "fiber_route_kml.cli:main"

[project.urls]
Repository = "https://github.com/gas-gatrapurna/fiber-route-kml"
Issues = "https://github.com/gas-gatrapurna/fiber-route-kml/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
